[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tepmon"
version = "0.1.0"
description = "Classical and machine-learning process monitoring on the Tennessee Eastman Process"
authors = [{ name = "Jorge Santiago Rodríguez Peñalosa" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "scikit-learn>=1.0", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["tepmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
